name: Android CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is not committed, so use a provisioned Gradle
      # matching gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Lint SDK (fails on NewApi)
        run: gradle :userback-sdk:lintRelease

      - name: Build SDK and sample
        run: gradle :userback-sdk:assembleRelease :Sample:app:assembleDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: userback-sdk/build/reports/lint-results-release.html
